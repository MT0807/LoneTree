片」。" data-en="Move to the 3D window, right-click the selected piece, and choose Reset 3D Pattern.">鼠标移到 3D 窗口，在选中的版片上右键，选择「重置 3D 版片」。</li><li data-zh="检查版片是否恢复平展；必要时用 Gizmo 或安排点重新放置，再重新检查缝线方向。" data-en="Check that the pieces are flat. Reposition them with the Gizmo or arrangement points if needed, then check the seam directions again.">检查版片是否恢复平展；必要时用 Gizmo 或安排点重新放置，再重新检查缝线方向。</li></ol><video controls autoplay muted loop playsinline preload="metadata" aria-label="选中版片并重置 3D 版片的操作录屏 / Reset 3D Pattern demonstration"><source src="assets/simulation/04-reset-3d-pattern.mp4" type="video/mp4">您的浏览器不支持视频播放。</video><div class="reset-actions"><a href="index.html#tool-segment" data-zh="← 返回缝纫课程" data-en="← Back to Sewing">← 返回缝纫课程</a><a href="index.html#tool-simulation" data-zh="查看完整模拟课程 ↗" data-en="View full Simulation lesson ↗">查看完整模拟课程 ↗</a></div></div></main><script src="translations.js"></script><script src="language-menu.js"></script><script defer src="../../../assets/input-cues.js?v=20261019"></script><script src="search-index.js"></script><script src="search.js"></script></body></html>
